# ALK and ABL1 wild-type codons — RefSeq-sourced, ClinVar-verified.
#
# "codon" values are the three-base DNA codon on the SENSE strand of the
# RefSeq CDS. The resulting amino acid is computed by src.codon_tools.translate()
# and verified at load time.
#
# This file is a working slice during Phase 1. The FULL kinase-domain codon
# tables (ALK F1116-G1392; ABL1 roughly 240-500) are to be assembled from the
# complete RefSeq CDS once we have it in hand (either via Michele or by reading
# Oh 2026 Supplementary Table S11, which contains the EML4-ALK v1 WT CDS).
#
# Each entry includes a "verified_by" field that names the specific primary
# source confirming the codon. For residues named in Zhang 2011, Doi 2022,
# Takei 2025, or the Oh 2026 atlas, we cross-check against ClinVar when a
# nucleotide-level variant record exists.

