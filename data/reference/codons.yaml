# -------------------------------------------------------------------------
# ABL1 — Bradeen 2006 + Azam 2003 on BCR-ABL1 + imatinib (T2).
# -------------------------------------------------------------------------
# Scientifically important note on completeness. For the T2 ratio test, the
# analytical primitive is NOT the WT codon identity per se but the SET OF
# PYRIMIDINE-REFERENCED SUBSTITUTION CLASSES reachable in one nucleotide step
# from a WT codon encoding the WT amino acid to a codon encoding the mutant
# amino acid. For "class-forced" variants (18/20 Bradeen imatinib; 50/76 Azam
# Table 1), that set has size 1 under every synonymous WT codon encoding the
# WT residue — the class is thus determined by the amino-acid grammar alone
# and is RefSeq-independent. See:
#   data/raw/bradeen_2006/derive_substitution_classes.py
#   data/raw/azam_2003/derive_substitution_classes.py
#
# For "class-ambiguous" variants (Bradeen: Q252H, F317L; Azam: 26 variants),
# the exact WT codon identity determines which class the route lies in; those
# variants are excluded from the primary T2 test by §5 of preregistration.md
# and reported with a sensitivity bracket.
#
# The anchor codons recorded here are the 4 Bradeen/Azam residues confirmed
# via ClinVar HGVS c. notation (independent of the derivation above), plus
# a cascade-locked WT codon for L248 inferred from the L248R one-nt route
# constraint.
# -------------------------------------------------------------------------
abl1_nm_005157_6:
  description: "ABL1 transcript variant a (isoform 1a), RefSeq NM_005157.6 (CDS)."
  reference: "https://www.ncbi.nlm.nih.gov/nuccore/NM_005157.6"
  kinase_domain_residues: [240, 500]  # roughly, SH1 domain
  status: "Partial. ClinVar-anchored residues locked; full CDS verification pending."
  key_residues:
    244:  # M244V/I — only ATG encodes Met.
      codon: "ATG"
      verified_by: "Genetic code (Met=ATG only)"
    248:  # L248R forces WT = CTN (one-nt route genetic-code constraint).
      candidate_codons: ["CTA", "CTC", "CTG", "CTT"]
      verified_by: >-
        Cascade from L248R: only Leu codons in the CTN family admit a single-nt
        route to any Arg codon (pos2 T>G). This then forces L248V to class C>G
        (pos1 C>G, under any of the 4 CTN options).
    250:  # G250E — pos2 G>A forced; WT GGG or GGA (literature consensus GGA).
      candidate_codons: ["GGA", "GGG"]
      verified_by: "Genetic code (Gly G250E only via pos2 G>A from GGN with G|A at pos3)"
    252:  # Q252H — CLASS AMBIGUOUS: CAG vs CAA give different route classes.
      candidate_codons: ["CAA", "CAG"]
      verified_by: "Unresolved; class-ambiguous — excluded from primary"
    253:  # Y253H — ClinVar c.757T>C anchor.
      codon: "TAC"
      verified_by: "ClinVar NM_005157.6:c.757T>C -> Y253H (pos1 T)"
    255:  # E255K/V — pos1 G>A (K) and pos2 A>T (V) both A/G codon-independent.
      candidate_codons: ["GAA", "GAG"]
      verified_by: >-
        ClinVar NM_005157.6:c.764A>T -> E255V fixes pos2 as A (both GAA and GAG
        satisfy this). Pos3 ambiguity does not affect substitution class for
        K or V routes (both class-forced to C>T and T>A respectively).
    276:  # D276G — pos2 A>G forced regardless of pos3.
      candidate_codons: ["GAC", "GAT"]
      verified_by: "Genetic code (Asp->Gly only via pos2 A>G in GAC/GAT; class T>C either way)"
    311:  # F311I/V — pos1 T>A (I) or pos1 T>G (V) both independent of pos3.
      candidate_codons: ["TTC", "TTT"]
      verified_by: "Genetic code (Phe->Ile/Val only via pos1; both class-forced)"
    315:  # T315I — ClinVar c.944C>T anchor.
      codon: "ACT"
      verified_by: "ClinVar NM_005157.6:c.944C>T -> T315I (pos2 C)"
    317:  # F317L — CLASS AMBIGUOUS: TTC vs TTT give different route classes.
      candidate_codons: ["TTC", "TTT"]
      verified_by: "Unresolved; class-ambiguous — excluded from primary"
    351:  # M351T — pos2 T>C forced; Met only ATG.
      codon: "ATG"
      verified_by: "Genetic code (Met=ATG only)"
    355:  # E355G — pos2 A>G forced regardless of pos3.
      candidate_codons: ["GAA", "GAG"]
      verified_by: "Genetic code (Glu->Gly only via pos2 A>G; class T>C either way)"
    359:  # F359C/V — pos2 T>G (C) or pos1 T>G (V) both independent of pos3.
      candidate_codons: ["TTC", "TTT"]
      verified_by: "Genetic code (Phe->Cys/Val only via pos1/2 single step; both forced)"
    379:  # V379I — pos1 G>A forced; WT must be GTC/GTT/GTA (not GTG).
      candidate_codons: ["GTA", "GTC", "GTT"]
      verified_by: "Genetic code (Val->Ile only from GTC/GTT/GTA via pos1 G>A; GTG unreachable in 1 nt)"
    384:  # L384M — only CTG->ATG is a one-nt Leu->Met route.
      codon: "CTG"
      verified_by: "Genetic code (Leu->Met in 1 nt only from CTG via pos1 C>A)"
    396:  # H396R/P — ClinVar c.1187A>G anchor fixes pos2 as A.
      candidate_codons: ["CAC", "CAT"]
      verified_by: "ClinVar NM_005157.6:c.1187A>G -> H396R (pos2 A; class T>C either way)"
